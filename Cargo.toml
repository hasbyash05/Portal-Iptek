[package]
name = "iptek-backend"
version = "1.0.0"
edition = "2021"
description = "Sistem Informasi Manajemen (SIM) Internal UKM IPTEK STIKES Semarang - Pure Rust Backend"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "chrono", "bigdecimal", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.17"
dotenvy = "0.15"
base64 = "0.22"
rand = "0.8"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2"
http = "1"
bytes = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
